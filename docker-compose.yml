services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: messenger
      POSTGRES_PASSWORD: messenger
      POSTGRES_DB: messenger
    ports:
      # Порт наружу нужен, чтобы гонять миграции и тесты с хоста.
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U messenger -d messenger']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
    environment:
      PORT: 3001
      # Внутри compose база доступна по имени сервиса, а не по localhost.
      DATABASE_URL: postgres://messenger:messenger@postgres:5432/messenger
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
