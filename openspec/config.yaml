schema: spec-driven

context: |
  Language: russian
  All artifacts must be written in russian.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  ## Продукт

  `messenger-backend` - собственный бэкенд веб-мессенджера `messenger`:
  регистрация и вход, профиль пользователя, чаты и обмен сообщениями.

  Бэкенд реализует контракт учебного API Яндекс.Практикума «Chat & OAuth API»
  один в один: те же пути, методы, коды ответов и состав полей. Фронту для
  перехода достаточно подменить `apiBaseUrl`. Отклонение от контракта - не
  свобода реализации, а ломающее изменение, которое требует синхронной правки
  фронта; оно заводится отдельным change и обсуждается до кода.

  Контракт лежит копией в `docs/api/swagger.json`. Endpoint, метод и состав
  полей сверяй по нему, а не по памяти и не по коду фронта.

  Пользователь один - зарегистрированный человек, который переписывается с
  другими пользователями. Ролей и админки нет.

  Реализовано сейчас: ничего, кроме каркаса и `GET /api/v2/health`.

  ## Стек и структура

  .NET 10, ASP.NET Core на контроллерах, PostgreSQL через EF Core с провайдером
  Npgsql. Тесты: xUnit - unit и e2e через `WebApplicationFactory`, оба в одном
  проекте `test/Messenger.Api.Tests/`. Формат кода - `dotnet format` по
  `.editorconfig`.

  - `src/Messenger.Api/Controllers/` - контроллеры API;
  - `src/Messenger.Api/Program.cs` - composition root;
  - `test/Messenger.Api.Tests/` - тесты;
  - `Messenger.slnx` - solution, `global.json` - версия SDK.

  Глобальный префикс путей - `api/v2`, он задан один раз в
  `Controllers/ApiControllerBase.cs` и повторяет форму контракта.

  Схема БД пуста до первого change: таблицы заводятся вместе с эндпоинтами,
  которые их читают, а не заранее.

  Инструменты процесса живут вне npm: OpenSpec CLI ставится через
  `brew install openspec`, git-хуки - Husky.Net из `dotnet-tools.json`.

  ## Глоссарий

  Словарь домена - `CONTEXT.md` в репозитории фронта `messenger`. Домен у
  фронта и бэкенда общий, поэтому второго словаря не заводим: две копии
  разойдутся. Здесь он не дублируется.

  Термины OpenSpec: capability - каталог в `openspec/specs/`; change -
  предложенное изменение в `openspec/changes/`; delta - файл спеки внутри
  change; requirement и scenario - заголовки внутри спеки.

  ## Конвенции работы

  Разработка ведется по OpenSpec: сначала меняется спецификация, потом код.
  Реализация идет блоками - блок это одна секция `tasks.md`.

  Без change обходятся только правки, не меняющие поведение: рефакторинг,
  конфигурация, документация, исправление сборки.

  Проверки блока: `dotnet format --verify-no-changes`, `dotnet build`,
  `dotnet test`.
